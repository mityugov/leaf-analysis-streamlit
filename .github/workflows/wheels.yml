name: wheels

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # vcpkg читает leaf_cpp/vcpkg.json и ставит зависимости (opencv4, pybind11).
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "leaf_cpp/vcpkg.json"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: leaf_cpp
        env:
          # Toolchain vcpkg — путь передаётся в CMake на всех платформах.
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MANIFEST_MODE: "ON"
          # На Linux cibuildwheel собирает внутри manylinux-контейнера.
          # Пробрасываем vcpkg внутрь: монтируем папку и передаём переменные.
          CIBW_ENVIRONMENT_LINUX: >-
            VCPKG_ROOT=/host${{ github.workspace }}/vcpkg
            CMAKE_TOOLCHAIN_FILE=/host${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
            VCPKG_MANIFEST_MODE=ON
          # Системные библиотеки, нужные OpenCV в manylinux-контейнере.
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y zip unzip tar curl ninja-build perl-IPC-Cmd ||
            (apt-get update && apt-get install -y zip unzip tar curl ninja-build)

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl