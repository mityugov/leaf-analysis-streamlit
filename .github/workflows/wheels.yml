name: wheels

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "leaf_cpp/vcpkg.json"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: leaf_cpp
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MANIFEST_MODE: "ON"

          CIBW_ENVIRONMENT_LINUX: >-
            VCPKG_ROOT=/host${{ github.workspace }}/vcpkg
            CMAKE_TOOLCHAIN_FILE=/host${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
            VCPKG_MANIFEST_MODE=ON

          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y zip unzip tar curl perl-IPC-Cmd
            mesa-libGL-devel glib2-devel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl